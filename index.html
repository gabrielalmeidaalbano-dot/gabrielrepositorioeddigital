<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>
    
    <!-- CSS interno fica na tag <style> dentro do <head> -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Título Principal</h1>
    <p>Este é um parágrafo de texto em HTML.</p>

    <!-- JavaScript interno fica na tag <script> antes do fim do <body> -->
    <script>
        console.log("Código JavaScript executado!");
    </script>
</body>
</html>
